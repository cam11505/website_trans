name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: pnpm audit:dependencies

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: CLI smoke test
        run: |
          node apps/cli/dist/index.js --help
          node apps/cli/dist/index.js --version

      - name: Release package smoke test
        run: pnpm release:check

      - name: Bundled offline source inventory smoke test
        run: node apps/cli/test/packaged-inventory-smoke.mjs

      - name: Bundled offline HTML import smoke test
        run: node apps/cli/test/packaged-import-smoke.mjs

      - name: Bundled source snapshot replay smoke test
        run: node apps/cli/test/packaged-replay-smoke.mjs

      - name: Bundled migration coverage and legacy report smoke test
        run: node apps/cli/test/packaged-coverage-smoke.mjs
