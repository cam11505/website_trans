name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-matrix:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CI: 'true'
      SITE_RESCUE_CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        if: runner.os == 'Linux'
        run: pnpm audit:dependencies

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: CLI smoke test
        run: |
          node apps/cli/dist/index.js --help
          node apps/cli/dist/index.js --version

      - name: Release package smoke test
        run: pnpm release:check

      - name: Bundled offline source inventory smoke test
        run: node apps/cli/test/packaged-inventory-smoke.mjs

      - name: Bundled offline HTML import smoke test
        run: node apps/cli/test/packaged-import-smoke.mjs

      - name: Bundled source snapshot replay smoke test
        run: node apps/cli/test/packaged-replay-smoke.mjs

      - name: Bundled migration coverage and legacy report smoke test
        run: node apps/cli/test/packaged-coverage-smoke.mjs

      - name: Bundled exact-query mapping and redirect smoke test
        run: node apps/cli/test/packaged-query-smoke.mjs

      - name: Bundled guided offline wizard smoke test
        run: node apps/cli/test/packaged-wizard-smoke.mjs

      - name: Relocated candidate package end-to-end smoke test
        run: node apps/cli/test/packaged-candidate-smoke.mjs

  quality:
    name: Quality checks
    if: always()
    needs: quality-matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platform checks to pass
        env:
          MATRIX_RESULT: ${{ needs.quality-matrix.result }}
        run: test "$MATRIX_RESULT" = success
