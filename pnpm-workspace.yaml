packages:
  - apps/*
  - packages/*
  - packages/adapters/*
  - packages/exporters/*

allowBuilds:
  esbuild: true

# Patched same-major versions for vulnerable transitive dependency ranges.
overrides:
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
